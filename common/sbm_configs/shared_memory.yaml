include_variables:
  - "shared_memory_vars.yaml"
  # FIXME uncomment when needed- "shared_memory_all_blas_libs.yaml"

variables:
  walltime: ['00:10:00']

# == Environment variables ==
# Each configuration sets:
# CC     --> C compiler executable
# CXX    --> C++ compiler executable
# CFLAGS --> Arguments to be passed to the compiler
# CLINK  --> -L/-l arguments to be passed to the compiler (link libraries)

# TODOs
# - uniform compiler versions


# Local testing
debug:
  scheduler: local

  default_conf:
    env: 
      - "OMP_PROC_BIND=close"
      - "OMP_PLACES=cores"

  configs:
    - name: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__{ncpus}"
      env:
        - "CC={compiler_c[compiler]}"
        - "CXX={compiler_cxx[compiler]}"
        - 'CFLAGS="{compiler_opt[compiler]} {compiler_common[compiler]} {compiler_march} {compiler_extra_flags[compiler_extra_flags_name]}"'
        - "OMP_NUM_THREADS={ncpus}"


# BananaPiF3 @ Dalek
dalek-mono-bpi-f3: 
  scheduler: slurm

  default_conf:
    exclusive: true
    partition: "mono"
    nodelist: "mono-bpi-f3"
    env: 
      - "OMP_PROC_BIND=close"
      - "OMP_PLACES=cores"
    # modules:
    #   - "ncm/1.1.2"

  configs:
    - name: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__{ncpus}"
      time: "{walltime}"
      env:
        - "CC={compiler_c[compiler]}"
        - "CXX={compiler_cxx[compiler]}"
        - 'CFLAGS="{compiler_opt[compiler]} {compiler_common[compiler]} {compiler_march} {compiler_extra_flags[compiler_extra_flags_name]}"'
        - "OMP_NUM_THREADS={ncpus}"
      custom_headers:
        - "#SBATCH --cpus-per-task={ncpus}"
        - "source /etc/profile.d/modules.sh"
        - "export LD_LIBRARY_PATH={ld_library_path_compiler[compiler]}"
        - "export NCM_PATH=/opt/software/ncm-1.1.2/bin/ncm-control"
      

