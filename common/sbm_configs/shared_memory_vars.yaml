################
# System specs #
################

ncpus:
  per_cluster:
    leonardo:           [1, 2, 4, 8, 16, 32, 56, 64, 72, 112]
    thea:               [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128, 144]
    e4:                 [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128]
    bsc-hca-pioneer:    [1, 2, 4, 8, 16, 32, 56, 64]
    bsc-hca-bananaf3:   [1, 2, 4, 8]
    dalek-mono-bpi-f3:  [1, 2, 4, 8]
    dalek-mono-sip-k3:  [1, 2, 4, 8]
    debug:              [1, 2, 4]


########################
# Compiler definitions #
########################

compiler:
  default:              ["gcc", "clang"]
  per_cluster:
    bsc-hca-pioneer:    ["gcc", "clang_epi_rvv071"]
    bsc-hca-bananaf3:   ["gcc", "clang_epi_rvv1"]
    dalek-mono-bpi-f3:  ["clang_epi_rvv1"] # "gcc", "clang", 
    dalek-mono-sip-k3:  ["clang_epi_rvv1"]

compiler_c:
  map:
    gcc:              ['gcc']
    clang:            ['clang']
    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI-rvv1/bin/clang']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI-rvv071/bin/clang']

compiler_cxx:
  map:
    gcc:              ['g++']
    clang:            ['clang++']
    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI-rvv1/bin/clang++']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI-rvv071/bin/clang++']


######################
# Compiler Arguments #
######################

ld_library_path_append:
  map:
    default: ['']
    clang_epi_rvv1: ['$HOME/software_env/llvm-EPI-rvv1/lib']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI-rvv071/lib']

compiler_common:
  map:
    default: ['-fopenmp -ffast-math']
    clang_epi_rvv1: ['-L$HOME/software_env/llvm-EPI-rvv1/lib -I$HOME/software_env/llvm-EPI-rvv1/include -fopenmp -ffast-math'] # These are in LD_LIBRARY_PATH from config
    clang_epi_rvv071: ['-L$HOME/software_env/llvm-EPI-rvv071/lib -I$HOME/software_env/llvm-EPI-rvv071/include -fopenmp -ffast-math'] # -L$HOME/software_env/llvm-EPI-rvv071/lib
 
compiler_opt:
  map:
    default: ['-O0', '-O3']
    compiler_maturity: ['-O0', '-O3', '-Ofast', '-Os']

compiler_march:
  default: ['-march=native -mtune=native']
  per_cluster:
    dalek-mono-bpi-f3:  ['-march=rv64gc']
    dalek-mono-sip-k3:  ['-march=rv64gc']
    bsc-hca-bananaf3:   ['-march=rv64gc']
    bsc-hca-pioneer:    ['-march=rv64gc']

compiler_extra_flags_name:
  map:
    clang_epi_rvv1: ['autovec', 'novec']
    clang_epi_rvv071: ['autovec', 'novec']
    default: ['none']

compiler_extra_flags:
  map:
    none:  ['']
    autovec:
      # TODO figure out the -mcpu=pioneer arg
      per_cluster:
        gcc:       ['-ftree-loop-vectorize -ftree-slp-vectorize'] # this is already gcc's default starting from O2, just specified explicitly (https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html)
        clang:     ['-fvectorize -fslp-vectorize'] # this is already clang's default, just specified explicitly (https://llvm.org/docs/Vectorizers.html#auto-vectorization-in-llvm)
        clang_epi: ['-mepi -fno-slp-vectorize -mllvm -combiner-store-merging=0 -mllvm -vectorizer-use-vp-strided-load-store -mllvm -enable-mem-access-versioning=0 -mllvm -disable-loop-idiom-memcpy -mllvm -disable-loop-idiom-memset -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize -lprovector-vecclonevp-atrevido_vec']
    novec:
      per_cluster:
        gcc:       ['-fno-tree-loop-vectorize -fno-tree-slp-vectorize']
        clang:     ['-fno-vectorize -fno-slp-vectorize']
        clang_epi: ['-fno-vectorize -fno-slp-vectorize -mllvm -combiner-store-merging=0 -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']

compiler_disass:
  map:
    default: ['objdump -d --demangle --no-show-raw-insn']


#######################
# Modules & Libraries #
#######################

compiler_module:
  map:
    gcc:
      per_cluster:
        default: ['']
    clang:
      per_cluster:
        default: ['']

    clang_epi:
      per_cluster:
        bsc-hca-pioneer:    ['llvm/EPI-0.7-development']
        bsc-hca-bananaf3:   ['llvm/EPI-development']
        bsc-hca-arriesgado: ['llvm/EPI-0.7-development']

libs:
  default: ['']
  per_cluster:
    debug: ['']


#######################
# Energy Measurements #
#######################

energy_measure_start:
  per_cluster:
    default: ['']
    dalek-mono-bpi-f3: ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log"']
    dalek-mono-sip-k3: ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log"']

energy_measure_stop:
  per_cluster:
    default: ['']
    dalek-mono-bpi-f3: ['python3 ../common/energy/ncm.py stop --print-tot-energy']
    dalek-mono-sip-k3: ['python3 ../common/energy/ncm.py stop --print-tot-energy']
