################
# System specs #
################

ncpus:
  per_cluster:
    debug:              [1, 2, 4]
    leonardo:           [1, 2, 4, 8, 16, 32, 56, 64, 72, 112]
    thea:               [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128, 144]
    e4:                 [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128]

    # BSC HCA
    bsc-hca-pioneer:    [1, 2, 4, 8, 16, 32, 56, 64]
    bsc-hca-bananaf3:   [1, 2, 4, 8]

    # Dalek
    dalek-mono-bpi-f3:  [1, 2, 4, 8]
    dalek-mono-sip-k3:  [1, 2, 4, 8]
    dalek-mono-jts-onx: [1, 2, 4, 8]
    dalek-mono-oh5:     [1, 2, 4, 8]
    dalek-minix:        [1, 2, 4, 8, 16]
    dalek-mono-rpi-5b:  [1, 2, 4]

    # MonteCimone
    mc-SG2042:          [1, 2, 4, 8, 16, 32, 56, 64, 128]
    mc-SG2044:          [1, 2, 4, 8, 16, 32, 56, 64]

    # Mare5
    MN5-GPP:            [1, 2, 4, 8, 16, 32, 56, 64, 112]
    MN5-GRACE:          [1, 2, 4, 8, 16, 32, 56, 64, 72, 144]

isa:
  per_cluster:
    debug:              ['x86']
    leonardo:           ['x86']
    thea:               ['arm']
    e4:                 ['riscv']

    # BSC HCA
    bsc-hca-pioneer:    ['riscv']
    bsc-hca-bananaf3:   ['riscv']

    # Dalek
    dalek-mono-bpi-f3:  ['riscv']
    dalek-mono-sip-k3:  ['riscv']
    dalek-mono-jts-onx: ['arm']
    dalek-mono-rpi-5b:  ['arm']
    dalek-mono-oh5:     ['x86']
    dalek-minix:        ['x86']

    # MonteCimone
    mc-SG2042:          ['riscv']
    mc-SG2044:          ['riscv']

    # Mare5
    MN5-GPP:            ['x86']
    MN5-GRACE:          ['arm']


########################
# Compiler definitions #
########################

# Abstract compiler name
compiler:
  default:              ["gcc", "clang"]
  per_cluster:
    # BSC HCA
    bsc-hca-pioneer:    ["clang_epi_rvv071", "gcc", "clang"]
    bsc-hca-bananaf3:   ["clang_epi_rvv1",   "gcc", "clang"]

    # Delek
    dalek-mono-bpi-f3:  ["clang_epi_rvv1", "gcc", "clang"] 
    dalek-mono-sip-k3:  ["clang_epi_rvv1", "gcc", "clang"]

    # MonteCimone
    mc-SG2042:          ["clang_epi_rvv071", "gcc", "clang"]
    mc-SG2044:          ["clang_epi_rvv1",   "gcc", "clang"]

# Actual C compiler paths mappings
compiler_c:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/bin/gcc']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/bin/gcc']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/bin/gcc']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/bin/gcc']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/bin/gcc']
        MN5-GPP:            ['$HOME/software_env/gcc/x86_64/16.1.0/bin/gcc']
        MN5-GRACE:          ['$HOME/software_env/gcc/aarch64/16.1.0/bin/gcc']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/bin/clang']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang']
        MN5-GPP:            ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang']
        MN5-GRACE:          ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/bin/clang']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/bin/clang']

# Actual C++ compiler paths mappings
compiler_cxx:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/bin/g++']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/bin/g++']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/bin/g++']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/bin/g++']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/bin/g++']
        MN5-GPP:            ['$HOME/software_env/gcc/x86_64/16.1.0/bin/g++']
        MN5-GRACE:          ['$HOME/software_env/gcc/aarch64/16.1.0/bin/g++']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/bin/clang++']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang++']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang++']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang++']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang++']
        MN5-GPP:            ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang++']
        MN5-GRACE:          ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang++']
        
    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/bin/clang++']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/bin/clang++']


######################
# Compiler Arguments #
######################

ld_library_path_compiler:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/lib:$HOME/software_env/gcc/riscv64/16.1.0/lib/gcc/riscv64-conda-linux-gnu/16.1.0']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/lib:$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/lib:$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/lib:$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/lib:$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0']
        MN5-GPP:            ['$HOME/software_env/gcc/x86_64/16.1.0/lib:$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0']
        MN5-GRACE:          ['$HOME/software_env/gcc/aarch64/16.1.0/lib:$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/lib']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/lib']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/lib']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/lib:$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/lib:$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu']
        MN5-GPP:            ['$HOME/software_env/clang/x86_64/23.1.0/lib:$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu']
        MN5-GRACE:          ['$HOME/software_env/clang/aarch64/23.1.0/lib']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/lib']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/lib']

openmp_library_path:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/lib/gcc/riscv64-conda-linux-gnu/16.1.0/libgomp.so']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/libgomp.so']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/libgomp.so']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/libgomp.so']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/libgomp.so']
        MN5-GPP:            ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/libgomp.so']
        MN5-GRACE:          ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/libgomp.so']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/lib/libomp.so']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/lib/libomp.so']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/lib/libomp.so']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu/libomp.so']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu/libomp.so']
        MN5-GPP:            ['$HOME/software_env/clang/x86_64/23.1.0/lib/x86_64-unknown-linux-gnu/libomp.so']
        MN5-GRACE:          ['$HOME/software_env/clang/aarch64/23.1.0/lib/libomp.so']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/lib/libomp.so']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/lib/libomp.so']

openmp_include_path:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/include']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/include']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/include']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/include']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/include']
        MN5-GPP:            ['$HOME/software_env/gcc/x86_64/16.1.0/lib/gcc/x86_64-conda-linux-gnu/16.1.0/include']
        MN5-GRACE:          ['$HOME/software_env/gcc/aarch64/16.1.0/lib/gcc/aarch64-conda-linux-gnu/16.1.0/include']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/include']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/include']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/include']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/include']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/include']
        MN5-GPP:            ['$HOME/software_env/clang/x86_64/23.1.0/include']
        MN5-GRACE:          ['$HOME/software_env/clang/aarch64/23.1.0/include']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/include']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/include']

compiler_common:
  map:
    default: ['-fopenmp -ffast-math']
    
    clang_epi_rvv1:
      default: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv1/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv1/include -fopenmp -ffast-math'] # These are in LD_LIBRARY_PATH from config
      per_cluster:
        mc-SG2042: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv1/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv1/include -fopenmp -ffast-math --gcc-install-dir="$(dirname "$(gcc -print-file-name=crtbeginS.o)")"']
        mc-SG2044: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv1/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv1/include -fopenmp -ffast-math --gcc-install-dir="$(dirname "$(gcc -print-file-name=crtbeginS.o)")"']
    
    clang_epi_rvv071:
      default: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv071/include -fopenmp -ffast-math'] # -L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib
      per_cluster:
        mc-SG2042: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv071/include -fopenmp -ffast-math --gcc-install-dir="$(dirname "$(gcc -print-file-name=crtbeginS.o)")"']
        mc-SG2044: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv071/include -fopenmp -ffast-math --gcc-install-dir="$(dirname "$(gcc -print-file-name=crtbeginS.o)")"']
    
compiler_opt:
  map:
    default: ['-O3']
    compiler_maturity: ['-O0', '-O3', '-Ofast', '-Os']

compiler_march:
  default: ['-march=native -mtune=native']
  per_cluster:
    dalek-mono-bpi-f3:  ['-march=rv64gc']
    dalek-mono-sip-k3:  ['-march=rv64gc']
    bsc-hca-bananaf3:   ['-march=rv64gc']
    bsc-hca-pioneer:    ['-march=rv64gc']
    mc-SG2042:          ['-march=rv64gc']
    mc-SG2044:          ['-march=rv64gc']

compiler_extra_flags_name:
  map:
    default:            ['none']
    gcc:                ['autovec_gcc', 'novec_gcc']
    clang:              ['autovec_clang', 'novec_clang']
    clang_epi_rvv1:     ['autovec_clang_epi_rvv1', 'novec_clang_epi_rvv1']
    clang_epi_rvv071:   ['autovec_clang_epi_rvv071', 'novec_clang_epi_rvv071']

compiler_extra_flags:
  map:
    none:  ['']

    autovec_gcc: ['-ftree-loop-vectorize -ftree-slp-vectorize'] # this is already gcc's default starting from O2, just specified explicitly (https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html)
    autovec_clang: ['-fvectorize -fslp-vectorize'] # this is already clang's default, just specified explicitly (https://llvm.org/docs/Vectorizers.html#auto-vectorization-in-llvm)
    autovec_clang_epi_rvv1: ['-mepi -fno-slp-vectorize -mllvm -combiner-store-merging=0 -mllvm -vectorizer-use-vp-strided-load-store -mllvm -enable-mem-access-versioning=0 -mllvm -disable-loop-idiom-memcpy -mllvm -disable-loop-idiom-memset -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize -lprovector-vecclonevp-atrevido_vec']
    autovec_clang_epi_rvv071: ['-mepi -fno-slp-vectorize -mllvm -combiner-store-merging=0 -mllvm -vectorizer-use-vp-strided-load-store -mllvm -enable-mem-access-versioning=0 -mllvm -disable-loop-idiom-memcpy -mllvm -disable-loop-idiom-memset -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']
    
    novec_gcc: ['-fno-tree-loop-vectorize -fno-tree-slp-vectorize']
    novec_clang: ['-fno-vectorize -fno-slp-vectorize']
    novec_clang_epi_rvv1: ['-fno-vectorize -fno-slp-vectorize -mllvm -combiner-store-merging=0 -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']
    novec_clang_epi_rvv071: ['-fno-vectorize -fno-slp-vectorize -mllvm -combiner-store-merging=0 -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']


compiler_disass:
  map:
    default: ['objdump -d --demangle --no-show-raw-insn']


