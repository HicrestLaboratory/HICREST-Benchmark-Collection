################
# System specs #
################

ncpus:
  per_cluster:
    debug:              [1, 2, 4]
    leonardo:           [1, 2, 4, 8, 16, 32, 56, 64, 72, 112]
    thea:               [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128, 144]
    e4:                 [1, 2, 4, 8, 16, 32, 56, 64, 72, 112, 128]

    # BSC HCA
    bsc-hca-pioneer:    [1, 2, 4, 8, 16, 32, 56, 64]
    bsc-hca-bananaf3:   [1, 2, 4, 8]

    # Dalek
    dalek-mono-bpi-f3:  [1, 2, 4, 8]
    dalek-mono-sip-k3:  [1, 2, 4, 8]
    dalek-mono-jts-onx: [1, 2, 4, 8]
    dalek-mono-oh5:     [1, 2, 4, 8]
    dalek-minix:        [1, 2, 4, 8]
    dalek-mono-rpi-5b:  [1, 2, 4]


########################
# Compiler definitions #
########################

# Abstract compiler name
compiler:
  default:              ["gcc", "clang"]
  per_cluster:
    # BSC HCA
    bsc-hca-pioneer:    ["clang_epi_rvv071", "gcc", "clang"]
    bsc-hca-bananaf3:   ["clang_epi_rvv1", "gcc", "clang"]

    # Delek
    dalek-mono-bpi-f3:  ["clang_epi_rvv1", "gcc", "clang"] 
    dalek-mono-sip-k3:  ["clang_epi_rvv1", "gcc", "clang"]

# Actual C compiler paths mappings
compiler_c:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/bin/gcc']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/bin/gcc']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/bin/gcc']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/bin/gcc']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/bin/gcc']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/bin/clang']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/bin/clang']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/bin/clang']

# Actual C++ compiler paths mappings
compiler_cxx:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/bin/g++']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/bin/g++']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/bin/g++']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/bin/g++']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/bin/g++']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/bin/clang++']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang++']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/bin/clang++']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang++']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/bin/clang++']
        
    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/bin/clang++']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/bin/clang++']


######################
# Compiler Arguments #
######################

ld_library_path_compiler:
  map:
    gcc:
      default: ['$HOME/software_env/gcc/riscv64/16.1.0/lib']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/gcc/aarch64/16.1.0/lib']
        dalek-mono-rpi-5b:  ['$HOME/software_env/gcc/aarch64/16.1.0/lib']
        dalek-mono-oh5:     ['$HOME/software_env/gcc/x86_64/16.1.0/lib']
        dalek-minix:        ['$HOME/software_env/gcc/x86_64/16.1.0/lib']

    clang:
      default: ['$HOME/software_env/clang/riscv64/23.1.0/lib']
      per_cluster:
        dalek-mono-jts-onx: ['$HOME/software_env/clang/aarch64/23.1.0/lib']
        dalek-mono-rpi-5b:  ['$HOME/software_env/clang/aarch64/23.1.0/lib']
        dalek-mono-oh5:     ['$HOME/software_env/clang/x86_64/23.1.0/lib']
        dalek-minix:        ['$HOME/software_env/clang/x86_64/23.1.0/lib']

    clang_epi_rvv1:   ['$HOME/software_env/llvm-EPI/riscv64/rvv1/lib']
    clang_epi_rvv071: ['$HOME/software_env/llvm-EPI/riscv64/rvv071/lib']


blas_lib_basepath:
  default: ['']
  map:
    opennblas:
      # TODO make this path more intuitive and structured
      default: ['$HOME/software_env/OpenBLAS-sg2044']
      per_cluster:
        other: ['otherclusterlib']

    blis:
      # TODO make this path more intuitive and structured
      default: ['$HOME/software_env/blis-sg2044']
      per_cluster:
        other: ['otherclusterlib']


compiler_common:
  map:
    default: ['-fopenmp -ffast-math']
    clang_epi_rvv1: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv1/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv1/include -fopenmp -ffast-math'] # These are in LD_LIBRARY_PATH from config
    clang_epi_rvv071: ['-L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib -I$HOME/software_env/llvm-EPI/riscv64/rvv071/include -fopenmp -ffast-math'] # -L$HOME/software_env/llvm-EPI/riscv64/rvv071/lib
 
compiler_opt:
  map:
    default: ['-O3']
    compiler_maturity: ['-O0', '-O3', '-Ofast', '-Os']

compiler_march:
  default: ['-march=native -mtune=native']
  per_cluster:
    dalek-mono-bpi-f3:  ['-march=rv64gc']
    dalek-mono-sip-k3:  ['-march=rv64gc']
    bsc-hca-bananaf3:   ['-march=rv64gc']
    bsc-hca-pioneer:    ['-march=rv64gc']

compiler_extra_flags_name:
  map:
    default: ['none']
    gcc: ['autovec_gcc', 'novec_gcc']
    clang: ['autovec_clang', 'novec_clang']
    clang_epi_rvv1: ['autovec_clang_epi_rvv1', 'novec_clang_epi_rvv1']
    clang_epi_rvv071: ['autovec_clang_epi_rvv071', 'novec_clang_epi_rvv071']

compiler_extra_flags:
  map:
    none:  ['']

    autovec_gcc: ['-ftree-loop-vectorize -ftree-slp-vectorize'] # this is already gcc's default starting from O2, just specified explicitly (https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html)
    autovec_clang: ['-fvectorize -fslp-vectorize'] # this is already clang's default, just specified explicitly (https://llvm.org/docs/Vectorizers.html#auto-vectorization-in-llvm)
    autovec_clang_epi_rvv1: ['-mepi -fno-slp-vectorize -mllvm -combiner-store-merging=0 -mllvm -vectorizer-use-vp-strided-load-store -mllvm -enable-mem-access-versioning=0 -mllvm -disable-loop-idiom-memcpy -mllvm -disable-loop-idiom-memset -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize -lprovector-vecclonevp-atrevido_vec']
    autovec_clang_epi_rvv071: ['-mepi -fno-slp-vectorize -mllvm -combiner-store-merging=0 -mllvm -vectorizer-use-vp-strided-load-store -mllvm -enable-mem-access-versioning=0 -mllvm -disable-loop-idiom-memcpy -mllvm -disable-loop-idiom-memset -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize -lprovector-vecclonevp-atrevido_vec']
    
    novec_gcc: ['-fno-tree-loop-vectorize -fno-tree-slp-vectorize']
    novec_clang: ['-fno-vectorize -fno-slp-vectorize']
    novec_clang_epi_rvv1: ['-fno-vectorize -fno-slp-vectorize -mllvm -combiner-store-merging=0 -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']
    novec_clang_epi_rvv071: ['-fno-vectorize -fno-slp-vectorize -mllvm -combiner-store-merging=0 -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize']


compiler_disass:
  map:
    default: ['objdump -d --demangle --no-show-raw-insn']


#######################
# Modules & Libraries #
#######################

compiler_module:
  map:
    gcc:
      per_cluster:
        default: ['']
    clang:
      per_cluster:
        default: ['']

    clang_epi:
      per_cluster:
        bsc-hca-pioneer:    ['llvm/EPI-0.7-development']
        bsc-hca-bananaf3:   ['llvm/EPI-development']
        bsc-hca-arriesgado: ['llvm/EPI-0.7-development']

blas_lib: ['', 'openblas', 'blis']


#######################
# Energy Measurements #
#######################

energy_measure_start:
  per_cluster:
    default: ['']
    bsc-hca-pioneer:    ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-jts-onx: ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-oh5:     ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-minix:        ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-rpi-5b:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']

energy_measure_stop:
  per_cluster:
    default: ['']
    bsc-hca-pioneer:    ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-jts-onx: ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-oh5:     ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-minix:        ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-rpi-5b:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
