#######################
# Energy Measurements #
#######################

energy_measure_start:
  per_cluster:
    default: [""]
    bsc-hca-pioneer:    ['mkdir -p $HOME/tmp && python3 ../common/energy/ncm.py start --output "$HOME/tmp/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "$HOME/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-sip-k3:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-jts-onx: ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-oh5:     ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-minix:        ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-rpi-5b:  ['python3 ../common/energy/ncm.py start --output "/scratch/$(whoami)/energy_${SBATCHMAN_JOB_TAG}.log" --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    mc-SG2042:          [''] # TODO check ["export EXAMON_START_TS=$(date +%s%3N)"]
    mc-SG2044:          ["export EXAMON_START_TS=$(date +%s%3N)"]
    MN5-GPP:            [""]
    MN5-GRACE:          [""]

energy_measure_stop:
  per_cluster:
    default: [""]
    bsc-hca-pioneer:    ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "$HOME/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
    dalek-mono-bpi-f3:  ['python3 ../common/energy/ncm.py stop --print-tot-energy --pidfile "/tmp/energy_${SBATCHMAN_JOB_TAG}.pid"']
