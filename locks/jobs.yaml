configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "vars.yaml"

variables:
  internal_run_time_s: [10] # seconds per internal run
  nruns: [3]                # number of repetitions (must be odd)

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}____{ncpus}"
    config_jobs:
      - tag: "Lock_{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
        preprocess: "{energy_measure_start}"
        command: "bin/{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]} {ncpus} {internal_run_time_s} {nruns}"
        postprocess: "{energy_measure_stop}"
