sequential: true

configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "../common/shared_memory_all_compiler_flags.yaml"
  - "vars.yaml"

preprocess: |
  mkdir -p bin/{isa}
  BIN_NAME="{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
  
command: '{compiler_c[compiler]} {compiler_opt[compiler]} -DAlgorithm={lock} -DNDEBUG -DPIN -DNCS_DELAY=20 -std=gnu11 -Wall -Wextra -Werror -Wno-implicit-fallthrough {compiler_common[compiler]} {compiler_march} {compiler_extra_flags[compiler_extra_flags_name]} Harness.c -lpthread -lm -o "bin/{isa}/$BIN_NAME"'
postprocess: 'mkdir -p "$SBATCHMAN_JOB_DIR/{isa}"; {compiler_disass[compiler]} "bin/{isa}/$BIN_NAME" > "$SBATCHMAN_JOB_DIR/{isa}/$BIN_NAME".asm'
check: '[[ -f "bin/{isa}/$BIN_NAME" ]]'


jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}____1"
    config_jobs:
      - tag: "compile_lock_{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
        category: "compile"
