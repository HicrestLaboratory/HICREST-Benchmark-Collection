sequential: true

configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "vars.yaml"

preprocess: |
  mkdir -p bin
  BIN_NAME="{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
  
command: '{compiler_c[compiler]} {compiler_opt[compiler]} -DAlgorithm={lock} -DNDEBUG -DPIN -DNCS_DELAY=20 -std=gnu11 -Wall -Wextra -Werror -Wno-implicit-fallthrough {compiler_common[compiler]} {compiler_march} {compiler_extra_flags[compiler_extra_flags_name]} Harness.c -lpthread -lm -o "bin/$BIN_NAME"'
postprocess: '{compiler_disass[compiler]} "bin/$BIN_NAME" > "$SBATCHMAN_JOB_DIR/$BIN_NAME".asm'
check: '[[ -f "bin/$BIN_NAME" ]]'


jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}____1"
    config_jobs:
      - tag: "compile_Lock_{lock}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
