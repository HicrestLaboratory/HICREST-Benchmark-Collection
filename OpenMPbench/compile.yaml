sequential: true

configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"


preprocess: |
  BIN_DIR="bin/{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
  mkdir -p "${BIN_DIR}"
  BIN_DIR="$BIN_DIR" make clean
  TARGETS=(syncbench schedbench taskbench arraybench_1 arraybench_3 arraybench_9 arraybench_27 arraybench_81 arraybench_243 arraybench_729 arraybench_2187 arraybench_6561 arraybench_19683 arraybench_59049)

command: 'make BIN_DIR="$BIN_DIR" CC="$CC" CPPFLAGS="-E" CFLAGS="$CFLAGS" LDFLAGS="$CFLAGS" LIBS="-lm" all'

# check: |
#   for bin in "${TARGETS[@]}"; do [[ -f "$BIN_DIR/$bin" ]] || exit 1; done
#   CHECK_RES=$?

postprocess: 'for bin in "${TARGETS[@]}"; do {compiler_disass[compiler]} "$BIN_DIR/$bin" > "$SBATCHMAN_JOB_DIR/$bin.asm"; done'

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}____1"
    config_jobs:
      - tag: "compile_OpenMPbench_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
        category: "compile"
