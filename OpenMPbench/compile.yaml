sequential: true

configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "vars.yaml"


preprocess: |
  BIN_DIR="bin/{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
  mkdir -p "${BIN_DIR}"
  make BIN_DIR="$BIN_DIR" clean-{benchmark}

command: 'make BIN_DIR="$BIN_DIR" CC="$CC" CPPFLAGS="" CFLAGS="$CFLAGS" LDFLAGS="$CFLAGS" LIBS="-lm" {benchmark}'

check: '[[ -f "$BIN_DIR/{benchmark}" ]]'

postprocess: '{compiler_disass[compiler]} "$BIN_DIR/{benchmark}" > "$SBATCHMAN_JOB_DIR/{benchmark}.asm"'

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__4"
    config_jobs:
      - tag: "compile_OpenMPbench_{benchmark}_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}"
        category: "compile"
