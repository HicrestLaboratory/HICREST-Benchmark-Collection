configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "../common/sbm_configs/shared_memory_only_one_compiler.yaml"
  - "vars_numa.yaml"

variables:
  # Footprint of a single array
  elements:
    per_cluster:
      default:          [128000000] # 500MB with 4B dtype
      bsc-hca-pioneer:  [256000000] # 1GB with 4B dtype
      mc-SG2042:        [256000000] # 1GB with 4B dtype
      mc-SG2044:        [256000000] # 1GB with 4B dtype
      MN5-GPP:          [256000000] # 1GB with 4B dtype
      MN5-GRACE:        [256000000] # 1GB with 4B dtype
      isarco-epyc9135:  [256000000] # 1GB with 4B dtype

  # Per-kernel
  warmup: [5]
  runs: [25] 

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__{ncpus}"
    config_jobs:
      - tag: "stream_numa_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_{data_type}"
        category: "stream_numa"
        preprocess: |
          EXEC_NAME="stream_numa"
          if [[ "{nonuma}" == 1 ]]; then
            EXEC_NAME="stream_nonuma"
          fi
          BIN_NAME="${EXEC_NAME}_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_{data_type}"
          unset OMP_PROC_BIND
          unset OMP_PLACES
          unset GOMP_CPU_AFFINITY
          unset KMP_AFFINITY
          {energy_measure_start}
        command: >
          {energy_measure_before_exec}./bin/{isa}/${BIN_NAME} 
          -n {elements}
          -t {runs}
          -w {warmup}
          --csv
        # -v
        postprocess: '{energy_measure_stop}'
