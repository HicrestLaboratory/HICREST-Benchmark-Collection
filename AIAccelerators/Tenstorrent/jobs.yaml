# Matrix shapes from MLBench/mlops/MATRIX.md. Edit the 15 shape blocks below.
# Shared templates expand M, supported fidelities, and nonlinear layouts.
# N and K are singleton pairs per shape, never independent sweeps.
sequential: true

variables:
  M: [64, 512, 2048]
  dtype: [bfp8, bf16, fp32]
  warmup: [5]
  runs: [10]
  compute_grid_x: [8]
  compute_grid_y: [8]
  shard_grid_x: [8]
  shard_grid_y: [8]

jobs:

  # Square: N=3072, K=3072
  - config: tenstorrent_local
    variables:
      shape_family: [square]
      N: [3072]
      K: [3072]
    config_jobs: &operation_jobs

      # GEMM / BFP8
      - tag: "tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          dtype: [bfp8]
          math_fidelity: [lofi, hifi2]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GEMM / BF16
      - tag: "tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          dtype: [bf16]
          math_fidelity: [hifi2, hifi4]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GEMM / FP32
      - tag: "tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          dtype: [fp32]
          math_fidelity: [hifi4]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemm_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GEMV / BFP8
      - tag: "tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          M: [1]
          dtype: [bfp8]
          math_fidelity: [lofi, hifi2]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GEMV / BF16
      - tag: "tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          M: [1]
          dtype: [bf16]
          math_fidelity: [hifi2, hifi4]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GEMV / FP32
      - tag: "tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved"
        variables:
          M: [1]
          dtype: [fp32]
          math_fidelity: [hifi4]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          gemm
          --result-id tt_matrix_{shape_family}_gemv_{M}_{N}_{K}_{dtype}_{math_fidelity}_interleaved
          --no-power
          -- {M} {K} {N}
          --op matmul
          --math-fidelity {math_fidelity}
          --compute-grid-x {compute_grid_x}
          --compute-grid-y {compute_grid_y}
          --dtype {dtype}
          --layout tile
          --memory-layout interleaved
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # GELU / all datatypes and both layouts
      - tag: "tt_matrix_{shape_family}_gelu_{M}_{N}_{K}_{dtype}_none_{memory_layout}"
        variables:
          memory_layout: [interleaved, sharded]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          nonlinearity
          --result-id tt_matrix_{shape_family}_gelu_{M}_{N}_{K}_{dtype}_none_{memory_layout}
          --no-power
          -- {M} {N}
          --op gelu
          --softmax-dim -1
          --dtype {dtype}
          --layout tile
          --memory-layout {memory_layout}
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

      # SOFTMAX / all datatypes and both layouts
      - tag: "tt_matrix_{shape_family}_softmax_{M}_{N}_{K}_{dtype}_none_{memory_layout}"
        variables:
          memory_layout: [interleaved, sharded]
        command: >-
          bash ../AI-accelerators-benchmark/tenstorrent/scripts/launch_benchmark.sh
          nonlinearity
          --result-id tt_matrix_{shape_family}_softmax_{M}_{N}_{K}_{dtype}_none_{memory_layout}
          --no-power
          -- {M} {N}
          --op softmax
          --softmax-dim -1
          --dtype {dtype}
          --layout tile
          --memory-layout {memory_layout}
          --shard-grid-x {shard_grid_x}
          --shard-grid-y {shard_grid_y}
          --warmup={warmup}
          --run={runs}

  # Square: N=5120, K=5120
  - config: tenstorrent_local
    variables:
