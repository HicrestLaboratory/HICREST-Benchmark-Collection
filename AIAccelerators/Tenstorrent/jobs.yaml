    config_jobs: *operation_jobs

  # Short Wide: N=8192, K=5120
  - config: tenstorrent_local
    variables:
      shape_family: [short_wide]
      N: [8192]
      K: [5120]
    config_jobs: *operation_jobs

  # Short Wide: N=262144, K=5376
  - config: tenstorrent_local
    variables:
      shape_family: [short_wide]
