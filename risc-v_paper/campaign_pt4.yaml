name: "RISC-V Paper Pt4"
parallel_clusters: true

apps:
  - name: npb
    dir: ../NPB
    cluster_whitelist:
      - dalek-mono-bpi-f3
      - dalek-mono-oh5
      - dalek-mono-rpi-5b
      - dalek-mono-sip-k3
      - dalek-mono-jts-onx
      - dalek-minix
      - mc-SG2044
      - bsc-hca-pioneer
      - MN5-GRACE
      - MN5-GPP
    steps:
      - name: compile
        jobs: compile.yaml
        parallel_clusters: false
      - name: CG
        jobs: jobs.yaml
        jobs_args: '-t "*_CG_*"'
      - name: EP
        jobs: jobs.yaml
        jobs_args: '-t "*_EP_*"'
      - name: FT
        jobs: jobs.yaml
        jobs_args: '-t "*_FT_*"'
      - name: IS
        jobs: jobs.yaml
        jobs_args: '-t "*_IS_*"'
      - name: MG
        jobs: jobs.yaml
        jobs_args: '-t "*_MG_*"'
