name: "RISC-V Paper Pt2"
parallel_clusters: true

apps:
  - name: pointerchasing
    dir: ../PointerChasing
    # cluster_whitelist: [bsc-hca-pioneer]
    cluster_whitelist: [mc-SG2044] #, mc-SG2042]
    # cluster_whitelist:
    #   - dalek-mono-bpi-f3
    #   - dalek-mono-oh5
    #   - dalek-mono-rpi-5b
    #   - dalek-mono-sip-k3
    #   - dalek-mono-jts-onx
    #   - dalek-minix
    configs: []
    steps:
      - name: compile
        jobs: compile.yaml
        parallel_clusters: false
      - name: jobs
        jobs: jobs.yaml


  - name: mlbench
    dir: ../MLBench
    # cluster_whitelist: [bsc-hca-pioneer]
    # cluster_whitelist: [mc-SG2044] #, mc-SG2042]
    cluster_whitelist:
      - dalek-mono-sip-k3
      - dalek-mono-bpi-f3
      - dalek-mono-oh5
      # - dalek-mono-rpi-5b
      - dalek-mono-jts-onx
      - dalek-minix
    steps:
      - name: compile
        jobs: compile.yaml
      - name: inference
        jobs: jobs_inference.yaml
      - name: mlops-gemm
        jobs: jobs_operators.yaml
        jobs_args: '-t "gemm-*" -v ncpus=1 -v ncpus=8'
      - name: mlops-gemv
        jobs: jobs_operators.yaml
        jobs_args: '-t "gemv-*" -v ncpus=1 -v ncpus=8'
      - name: mlops-gelu
        jobs: jobs_operators.yaml
        jobs_args: '-t "gelu_*" -v ncpus=1 -v ncpus=8'
      - name: mlops-softmax
        jobs: jobs_operators.yaml
        jobs_args: '-t "softmax_*" -v ncpus=1 -v ncpus=8'