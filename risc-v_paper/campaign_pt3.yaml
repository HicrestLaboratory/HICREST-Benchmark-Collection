name: "RISC-V Paper Pt3"
parallel_clusters: true

apps:
  - name: stream_numa
    dir: ../STREAM
    cluster_whitelist:
      - dalek-mono-bpi-f3
      - dalek-mono-oh5
      - dalek-mono-rpi-5b
      - dalek-mono-sip-k3
      - dalek-mono-jts-onx
      - dalek-minix
      - mc-SG2044
      - bsc-hca-pioneer
      - MN5-GRACE
      - MN5-GPP
    steps:
      - name: compile
        jobs: compile_numa.yaml
        parallel_clusters: false
      - name: jobs
        jobs: jobs_numa.yaml

  - name: cachebfs
    dir: ../CacheBFS
    cluster_whitelist:
      - dalek-mono-bpi-f3
      - dalek-mono-oh5
      - dalek-mono-rpi-5b
      - dalek-mono-sip-k3
      - dalek-mono-jts-onx
      - dalek-minix
      - mc-SG2044
      - bsc-hca-pioneer
      - MN5-GRACE
      - MN5-GPP
    steps:
      - name: compile
        jobs: compile.yaml
        parallel_clusters: false
      - name: gap
        jobs: jobs.yaml
        jobs_args: '-t "*_gap_*"'
      - name: openmp
        jobs: jobs.yaml
        jobs_args: '-t "*_openmp_*"'
      - name: mutex
        jobs: jobs.yaml
        jobs_args: '-t "*_mutex_*"'
      - name: atomic
        jobs: jobs.yaml
        jobs_args: '-t "*_atomic_*"'
        