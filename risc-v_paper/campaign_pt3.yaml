name: "RISC-V Paper Pt3"
parallel_clusters: true

apps:
  - name: cachebfs
    dir: ../CacheBFS
    cluster_whitelist:
      - dalek-mono-sip-k3
      - dalek-mono-bpi-f3
      - dalek-mono-oh5
      # - dalek-mono-rpi-5b
      - dalek-mono-jts-onx
      - dalek-minix
    steps:
      - name: compile
        jobs: compile.yaml
        parallel_clusters: false
      - name: gap
        jobs: jobs.yaml
        jobs_args: '-t "*_gap_*"'
      - name: openmp
        jobs: jobs.yaml
        jobs_args: '-t "*_openmp_*"'
      - name: mutex
        jobs: jobs.yaml
        jobs_args: '-t "*_mutex_*"'
      - name: atomic
        jobs: jobs.yaml
        jobs_args: '-t "*_atomic_*"'
        