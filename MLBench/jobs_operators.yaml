configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "../common/sbm_configs/shared_memory_only_one_compiler.yaml"
  - "../common/sbm_configs/shared_memory_only_one_compiler_flags_set.yaml"
  - "../common/sbm_configs/shared_memory_all_blas_libs.yaml"

variables:
  blas_lib: ['openblas'] # TODO deleteme
  repetitions: [5]
  warmup: [2]
  seed: [42]

preprocess: |
  export LD_LIBRARY_PATH="$(pwd)/build_{compiler}_{isa}_{blas_lib}/bin:${LD_LIBRARY_PATH}"
  {energy_measure_start}
postprocess: '{energy_measure_stop}'

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__{ncpus}"
    config_jobs:

      - tag: "gemm_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_m{m}_k{k}_n{n}_{dtype}_{ncpus}cpus_{warmup}w_{repetitions}r_{seed}s"
        variables:
          m: [512] #, 1024, 2048]
          k: [512] #, 1024, 2048]
          n: [512] #, 1024, 2048]
          dtype: ["f16", "bf16", "q8_0"]
        category: "gemm-square"
        command: "{energy_measure_before_exec}./build_{compiler}_{isa}_{blas_lib}/mlops/gemm --m {m} --k {k} --n {n} --dtype {dtype} --threads {ncpus} --iters {repetitions} --warmup {warmup} --seed {seed}"

      # TODO create "gemm-ml" category

      - tag: "gemv_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_k{k}_m{m}_{dtype}_{ncpus}cpus_{warmup}w_{repetitions}r_{seed}s"
        variables:
          # FIXME
          m: [512] #, 1024, 2048]
          k: [512] #, 1024, 2048]
          dtype: ["f16", "bf16", "q8_0"]
        category: "gemv"
        command: "{energy_measure_before_exec}./build_{compiler}_{isa}_{blas_lib}/mlops/gemv --k {k} --m {m} --dtype {dtype} --threads {ncpus} --iters {repetitions} --warmup {warmup} --seed {seed}"

      - tag: "gelu_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_k{k}_n{n}_{dtype}_{ncpus}cpus_{warmup}w_{repetitions}r_{seed}s"
        variables:
          # FIXME
          k: [512] #, 1024, 2048]
          n: [512] #, 1024, 2048]
          dtype: ["f16", "f32"]
        category: "gelu"
        command: "{energy_measure_before_exec}./build_{compiler}_{isa}_{blas_lib}/mlops/gelu --k {k} --n {n} --dtype {dtype} --threads {ncpus} --iters {repetitions} --warmup {warmup} --seed {seed}"

      - tag: "softmax_{compiler}_{isa}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_k{k}_m{m}_{dtype}_{ncpus}cpus_{warmup}w_{repetitions}r_{seed}s"
        variables:
          # FIXME
          m: [512] #, 1024, 2048]
          k: [512] #, 1024, 2048]
          dtype: [ "f32"]
        category: "gelu"
        command: "{energy_measure_before_exec}./build_{compiler}_{isa}_{blas_lib}/mlops/softmax --k {k} --m {m} --dtype {dtype} --threads {ncpus} --iters {repetitions} --warmup {warmup} --seed {seed}"
