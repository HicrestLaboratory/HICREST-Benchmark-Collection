configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "vars.yaml"

variables:
  graph: "graphs/matrices_list.txt"
  nruns: [15]


jobs:
  - config: "{compiler}__{compiler_opt}__{compiler_extra_flags_name[compiler]}____{ncpus}"
    config_jobs:
      - tag: "MergedCSR-BFS_{compiler}_{compiler_opt}_{compiler_extra_flags_name[compiler]}_{implementation}_{chunksize}_{graph_filename}"
        command: "./MergedCSR_{implementation}/bin/bfs_chunksize{chunksize}_{ncpus}cpus -f {graph} -n {nruns}"

      - tag: "MergedCSR-BFS_{compiler}_{compiler_opt}_{compiler_extra_flags_name[compiler]}_{implementation}_{chunksize}_{graph_filename}"
        variables:
          implementation: ['openmp']
        command: "./MergedCSR_{implementation}/bin/bfs_{implementation}"
