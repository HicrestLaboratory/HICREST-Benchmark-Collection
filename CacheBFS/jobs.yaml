configs: "../common/sbm_configs/shared_memory.yaml"
include_variables:
  - "../common/sbm_configs/shared_memory_vars.yaml"
  - "../common/sbm_configs/shared_memory_only_one_compiler.yaml"
  - "../common/sbm_configs/shared_memory_only_one_compiler_flags_set.yaml"
  - "vars.yaml"

variables:
  graph: "graphs/matrices_list_mtx.txt"
  nruns: [10]

preprocess: "{energy_measure_start}"
postprocess: "{energy_measure_stop}"

jobs:
  - config: "{compiler}__{compiler_opt[compiler]}__{compiler_extra_flags_name[compiler]}__{blas_lib}__{ncpus}"
    config_jobs:

      # Mutex and Atomic
      - tag: "MergedCSR-BFS_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_{implementation}_{chunksize}_{graph_filename}_{ncpus}"
        category: "{implementation}"
        variables:
          implementation: ['mutex', 'atomic'] # , 'cnalock' numa complains...
        command: "{energy_measure_before_exec}bin/{compiler}_${SBATCHMAN_CLUSTER_NAME}/bfs_{implementation}_chunksize{chunksize}_{ncpus}maxcpus_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]} -f {graph} -n {nruns}"

      # OpenMP
      - tag: "MergedCSR-BFS_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_{implementation}_{chunksize}_{graph_filename}_{ncpus}"
        category: "{implementation}"
        variables:
          implementation: ['openmp']
        command: "{energy_measure_before_exec}bin/{compiler}_${SBATCHMAN_CLUSTER_NAME}/bfs_{implementation}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]} {graph} {nruns}"

      # GAP
      - tag: "MergedCSR-BFS_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]}_{implementation}_{chunksize}_{graph_filename}_{ncpus}"
        category: "{implementation}"
        variables:
          implementation: ['gap']
        command: "{energy_measure_before_exec}bin/{compiler}_${SBATCHMAN_CLUSTER_NAME}/bfs_{implementation}_{compiler}_{compiler_opt[compiler]}_{compiler_extra_flags_name[compiler]} -f {graph} -n {nruns}"
